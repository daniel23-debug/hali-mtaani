<style>

@keyframes slidein{ from{ transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;} }
.toast-icon{ font-size:16px; } .toast-title{ font-weight:700; font-size:12.5px; margin-bottom:2px;} .toast-body{ font-size:11.5px; color:var(--paper-dim); line-height:1.4;}
.field{ margin-bottom:14px; } .field label{ display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--paper-dim);}
.field input, .field select, .field textarea{ width:100%; background:var(--ink-3); border:1px solid var(--line-strong); border-radius:9px; padding:10px 12px; color:var(--paper); font-family:var(--font-body); font-size:13px; outline:none;}

.stat{ text-align:left; } .stat-num{ font-family:var(--font-display); font-size:26px; font-weight:600;} .stat-label{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--paper-dim); letter-spacing:.8px; margin-top:2px;}
.mobile-tabbar{ display:none; }

<body>
<div id="toast-layer"></div>
<div id="app"><div class="spinner-wrap"><div class="spinner"></div><div>Loading real data…</div></div></div>

<script>
/* =========================================================
   HALI MTAANI — PROTOTYPE
   All data is real and persisted via window.storage (shared).
   No seeded / fabricated content. Empty until people add it.
   ========================================================= */

const now = () => Date.now();
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'});
const fmtAgo = (ts) => {
  const diff = Math.floor((now()-ts)/60000);
  if(diff < 1) return 'just now';
  if(diff < 60) return diff+'m ago';
  if(diff < 1440) return Math.floor(diff/60)+'h ago';
  return Math.floor(diff/1440)+'d ago';
};
const uid = (p) => p + '-' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

const sourceColor = {community:'var(--murram)', official:'var(--sky)', platform:'var(--savanna)'};
const catIcon = {Flooding:'💧', Transport:'🚌', Utilities:'🔧', Infrastructure:'💡', Safety:'⚠️', Other:'📍'};
const catColor = {Flooding:'var(--sky)', Transport:'var(--ochre)', Utilities:'var(--murram)', Infrastructure:'var(--paper-dim)', Safety:'var(--murram)', Other:'var(--paper-dim)'};

/* SUPABASE CONFIG */
const SUPABASE_URL = 'https://ymodhguvnvzrxvohwgtk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_L-Wo7vr2j0bPyl1PPnZwPg_nkVfWRnD';
let supabase = null;
if(window.supabase) {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} else {
  console.warn('Supabase library not loaded');
}

/* ---------------- STORAGE LAYER (real persistence, shared) ---------------- */
const KEYS = {incidents:'incidents', providers:'providers', bookings:'bookings', alerts:'alerts', cases:'cases', orgs:'orgs'};

async function loadCollection(key){
  if(!supabase) return [];
  try{
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const { data, error } = await supabase.from(key).select('*');
    clearTimeout(timeout);
    if(error) throw error;
    return data || [];
  }catch(e){ 
    console.log(`Load ${key} skipped`);
    return [];
  }
}
async function saveCollection(key, arr){
  if(!supabase) return;
  try{
    if(arr.length > 0) await supabase.from(key).upsert(arr, {onConflict:'id'});
  }catch(e){ 
    console.log(`Save ${key} skipped`, e);
  }
}

const state = {
  loading:true,
  role:'resident', view:'feed',
  selectedIncident:null, selectedProvider:null, selectedCase:null,
  mapFilters:{incident:true, service:true},
  saving:false,
  userCoords:null,        // {lat,lng} from real device GPS, once granted
  locationLabel:'Locating…',
  locationStatus:'pending', // pending | ok | denied | unavailable
};

/* ---------------- REAL GEOLOCATION ---------------- */
const NAIROBI_FALLBACK = {lat:-1.2921, lng:36.8219};

function requestGeolocation(onDone){
  if(!('geolocation' in navigator)){
    state.locationStatus='unavailable'; state.locationLabel='Location not supported';
    updateLocationPill(); if(onDone) onDone(null);
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const coords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    state.userCoords = coords; state.locationStatus='ok';
    await reverseGeocode(coords);
    if(onDone) onDone(coords);
  }, (err)=>{
    state.locationStatus = err.code===1 ? 'denied' : 'unavailable';
    state.locationLabel = err.code===1 ? 'Location permission denied' : 'Location unavailable';
    updateLocationPill();
    if(onDone) onDone(null);
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}
async function reverseGeocode(coords){
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 6000);
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${coords.lat}&lon=${coords.lng}&zoom=14&addressdetails=1`, {signal:controller.signal, headers:{'Accept':'application/json'}});
    clearTimeout(timeout);
    const j = await res.json();
    const a = j.address || {};
    const area = a.suburb || a.neighbourhood || a.town || a.city_district || a.village || a.city || 'Nearby area';
    const city = a.city || a.town || a.county || '';
    state.locationLabel = city && city!==area ? `${area}, ${city}` : area;
  }catch(e){
    state.locationLabel = `${coords.lat.toFixed(3)}, ${coords.lng.toFixed(3)}`;
  }
  updateLocationPill();
}
function updateLocationPill(){
  const el = document.getElementById('location-pill-text');
  if(el) el.textContent = state.locationLabel;
}

let data = { incidents:[], providers:[], bookings:[], alerts:[], cases:[], orgs:[] };

async function loadAll(){
  try {
    const loadPromise = Promise.all([
      loadCollection(KEYS.incidents), loadCollection(KEYS.providers), loadCollection(KEYS.bookings),
      loadCollection(KEYS.alerts), loadCollection(KEYS.cases), loadCollection(KEYS.orgs),
    ]);
    
    const timeoutPromise = new Promise((resolve) => 
      setTimeout(() => resolve([[], [], [], [], [], []]), 8000)
    );
    
    const [incidents, providers, bookings, alerts, cases, orgs] = await Promise.race([loadPromise, timeoutPromise]);
    data = {incidents, providers, bookings, alerts, cases, orgs};
  } catch (e) {
    console.log('Load failed, starting with empty data');
  }
  state.loading = false;
  render();
  requestGeolocation();
}

async function persist(key){
  state.saving = true; updateSyncDot();
  await saveCollection(KEYS[key], data[key]);
  state.saving = false; updateSyncDot();
}
function updateSyncDot(){
  const dot = document.getElementById('sync-dot');
  if(dot) dot.className = 'dot-live' + (state.saving ? ' saving' : '');
}

/* ---------------- TOASTS ---------------- */
function toast(title, body, icon){
  icon = icon || '🔔';
  const layer = document.getElementById('toast-layer');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<div class="toast-icon">${icon}</div><div><div class="toast-title">${title}</div><div class="toast-body">${body}</div></div>`;
  layer.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 4600);
}

/* ---------------- RENDER SHELL ---------------- */
function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><div>Loading real data…</div></div>`; return; }
  app.innerHTML = `
    <div class="sidebar">
      <div class="brand">

function renderContent(){

/* ---------------- SHARED UI PIECES ---------------- */
function confidenceBadge(inc){
  const sources = new Set(inc.timeline.map(t=>t.source));
  const dots = [...sources].map(s=>`<span class="cdot" style="background:${sourceColor[s]}"></span>`).join('');
  return `<span class="confidence"><span class="confidence-dots">${dots}</span><span class="confidence-pct">${inc.confidence}%</span> confidence · ${inc.confirmations} confirmation${inc.confirmations===1?'':'s'}</span>`;
}
function severityColor(s){ return s==='high'?'var(--murram)': s==='medium'?'var(--ochre)':'var(--paper-dim)'; }
function statusBadge(status){
  const map = {active:['badge-pending','Active'], responding:['badge-official','Responding'], resolved:['badge-verified','Resolved'], 'in-progress':['badge-official','In progress']};
  const [cls,label] = map[status] || ['badge-pending', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

/* ---------------- FEED ---------------- */
function viewFeed(){
  const list = [...data.incidents].sort((a,b)=>b.createdAt-a.createdAt);

    ${list.length ? `<div class="grid grid-2">${list.map(feedCard).join('')}</div>`

function qa(icon,label,view){ return `<button class="qa-btn" onclick="setView('${view}')"><span class="qa-icon">${icon}</span><span class="qa-label">${label}</span></button>`; }
function feedCard(inc){

  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s||''; return d.innerHTML; }

/* ---------------- MAP (real, Leaflet + OpenStreetMap) ---------------- */
let mainMap = null, miniMaps = {}, pinCoords = {rp:null, pv:null};

function viewMap(){
  const showIncidents = state.mapFilters.incident ? data.incidents : [];
  const showProviders = state.mapFilters.service ? data.providers : [];
  const empty = !showIncidents.length && !showProviders.length;
  return `
    <div class="page-head"><div><div class="page-title">Map</div><div class="page-sub">Real locations on an actual street map — pinned by reporters and providers.</div></div></div>
    <div class="map-wrap">
      <div id="leaflet-mainmap" style="position:absolute; inset:0;"></div>
      <div class="map-filters">${filterChip('incident','⚠️ Incidents')}${filterChip('service','🛠️ Services')}</div>
      ${empty ? `<div class="empty-state" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; pointer-events:none;"><div class="e-icon">🗺️</div>Nothing on the map yet — report an incident or register as a provider.</div>` : ''}
      <div class="map-legend"><div class="legend-item"><span class="legend-dot" style="background:var(--murram)"></span> High severity</div><div class="legend-item"><span class="legend-dot" style="background:var(--ochre)"></span> Medium</div><div class="legend-item"><span class="legend-dot" style="background:var(--savanna)"></span> Provider</div></div>
    </div>
  `;
}
function filterChip(key,label){ return `<button class="filter-chip ${state.mapFilters[key]?'on':''}" onclick="toggleFilter('${key}')">${label}</button>`; }
function toggleFilter(key){ state.mapFilters[key]=!state.mapFilters[key]; renderContent(); }

function initMainMap(){
  const container = document.getElementById('leaflet-mainmap');
  if(!container || typeof L==='undefined') return;
  const center = state.userCoords || NAIROBI_FALLBACK;
  mainMap = L.map(container, {zoomControl:true}).setView([center.lat, center.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(mainMap);

  const showIncidents = state.mapFilters.incident ? data.incidents : [];
  const showProviders = state.mapFilters.service ? data.providers : [];
  showIncidents.forEach(inc=>{
    if(inc.lat==null || inc.lng==null) return;
    const icon = L.divIcon({html:`<div class="lf-pin" style="background:${severityColor(inc.severity)}"><span>${catIcon[inc.category]||'!'}</span></div>`, className:'', iconSize:[30,30], iconAnchor:[15,30]});
    L.marker([inc.lat, inc.lng], {icon}).addTo(mainMap).bindTooltip(inc.title).on('click', ()=>openIncident(inc.id));
  });
  showProviders.forEach(p=>{
    if(p.lat==null || p.lng==null) return;
    const icon = L.divIcon({html:`<div class="lf-pin" style="background:var(--savanna)"><span>🔧</span></div>`, className:'', iconSize:[30,30], iconAnchor:[15,30]});
    L.marker([p.lat, p.lng], {icon}).addTo(mainMap).bindTooltip(p.name).on('click', ()=>openProvider(p.id));
  });
  if(state.userCoords){
    const youIcon = L.divIcon({html:`<div class="lf-pin-you"></div>`, className:'', iconSize:[16,16], iconAnchor:[8,8]});
    L.marker([state.userCoords.lat, state.userCoords.lng], {icon:youIcon}).addTo(mainMap).bindTooltip('You are here');
  }
}

function initMiniMap(key){
  const container = document.getElementById(key+'-map');
  if(!container || typeof L==='undefined') return;
  const start = pinCoords[key] || state.userCoords || NAIROBI_FALLBACK;
  const map = L.map(container, {zoomControl:false, attributionControl:false}).setView([start.lat, start.lng], pinCoords[key] ? 16 : 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
  let marker = null;
  function setPin(latlng){
    pinCoords[key] = {lat:latlng.lat, lng:latlng.lng};
    const icon = L.divIcon({html:'<div class="lf-pin-mini"></div>', className:'', iconSize:[22,22], iconAnchor:[11,22]});
    if(marker) marker.setLatLng(latlng); else marker = L.marker(latlng,{icon}).addTo(map);
    const status = document.getElementById(key+'-geo-status');
    if(status) status.textContent = `Pinned at ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
  }
  if(pinCoords[key]) setPin(L.latLng(pinCoords[key].lat, pinCoords[key].lng));
  map.on('click', e=>setPin(e.latlng));
  miniMaps[key] = map;
}

function useMyLocationFor(key){
  const btn = document.getElementById(key+'-locate-btn');
  if(btn) btn.classList.add('locating');
  requestGeolocation((coords)=>{
    if(btn) btn.classList.remove('locating');
    if(!coords){ toast('Location unavailable', 'Could not get your device location — tap the map to place a pin manually.', '⚠️'); return; }
    const map = miniMaps[key];
    if(map){ map.setView([coords.lat, coords.lng], 16); map.fire('click', {latlng: L.latLng(coords.lat, coords.lng)}); }
  });
}

function destroyMaps(){
  if(mainMap){ mainMap.remove(); mainMap=null; }
  Object.keys(miniMaps).forEach(k=>{ miniMaps[k].remove(); }); miniMaps={};
}
function initViewMaps(){
  if(typeof L==='undefined'){ setTimeout(initViewMaps, 300); return; }
  if(state.view==='map') initMainMap();
  if(state.view==='report') initMiniMap('rp');
  if(state.view==='provider-register') initMiniMap('pv');
}

function openIncident(id){ state.selectedIncident=id; setView('incident'); }

    <div class="grid grid-2">

        <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">

      </div>
      <div class="card">
        <div style="font-weight:700; font-size:13px; margin-bottom:12px;">Description</div>
        <div style="font-size:13px; color:var(--paper-dim); line-height:1.6;">${escapeHtml(inc.description || 'No further description provided.')}</div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div style="font-weight:700; font-size:13px; margin-bottom:14px;">Timeline</div>
      <div class="timeline">${inc.timeline.map(t=>`
          <div class="tl-item"><div class="tl-dot" style="background:${sourceColor[t.source]}"></div>
            <div class="tl-time">${fmtTime(t.time)} · ${fmtAgo(t.time)}</div>
            <div class="tl-text">${escapeHtml(t.text)}</div>
            <div class="tl-source">${escapeHtml(t.by)}</div></div>`).join('')}
      </div>
    </div>
  `;
}
function orgIncidentActions(inc, linkedCase){
  return `<div style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
    <div style="font-weight:700; font-size:12px; margin-bottom:8px; color:var(--paper-dim);">ORGANIZATION ACTIONS</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      ${!linkedCase ? `<button class="btn btn-secondary" onclick="openCaseFor('${inc.id}')">Open a case</button>` : ''}
      <button class="btn btn-secondary" onclick="advanceIncident('${inc.id}','responding')">Mark: Responding</button>
      <button class="btn btn-secondary" onclick="advanceIncident('${inc.id}','resolved')">Mark: Resolved</button>
    </div>
  </div>`;
}
async function confirmIncident(id){
  const inc = data.incidents.find(i=>i.id===id);
  inc.confirmations += 1;
  inc.confidence = Math.min(96, inc.confidence + 6);
  inc.timeline.push({time:now(), text:'A resident confirmed this incident. Confidence updated.', source:'community', by:'Resident confirmation'});
  await persist('incidents');
  toast('Confirmation recorded', `Confidence is now ${inc.confidence}%.`, '✅');
  renderContent();
}
async function advanceIncident(id, status){
  const inc = data.incidents.find(i=>i.id===id);
  inc.status = status;
  const label = status==='responding' ? 'Response dispatched by organization.' : 'Marked resolved by organization.';
  inc.timeline.push({time:now(), text:label, source:'official', by: activeOrgName()});
  const c = data.cases.find(c=>c.incidentId===id);
  if(c){ c.status = status==='resolved'?'resolved':'in-progress'; c.updatedAt = now(); await persist('cases'); }
  await persist('incidents');
  if(status==='resolved'){
    data.alerts.unshift({id:uid('a'), title:'Resolved', body:`"${inc.title}" has been marked resolved.`, time:now(), read:false, level:'success'});
    await persist('alerts');
  }
  toast('Status updated', label, '📣');
  renderContent();
}
async function openCaseFor(incidentId){
  const inc = data.incidents.find(i=>i.id===incidentId);
  const c = {id:uid('case'), incidentId, org:activeOrgName(), title:inc.title, status:'in-progress', priority:inc.severity, assignedTeam:'Unassigned', updatedAt:now()};
  data.cases.unshift(c);
  await persist('cases');
  toast('Case opened', 'This incident now has an operational case.', '🗂️');
  renderContent();
}
function activeOrgName(){ return data.orgs[0] ? data.orgs[0].name : 'Responding organization'; }
function miniMapField(key, hintText){
  return `<div class="field"><label>Location on map</label>
    <div class="mini-map" id="${key}-map"></div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <div class="hint">${hintText}</div>
      <button type="button" class="locate-btn" id="${key}-locate-btn" onclick="useMyLocationFor('${key}')">📍 Use my location</button>
    </div>
    <div class="geo-status" id="${key}-geo-status">${pinCoords[key] ? `Pinned at ${pinCoords[key].lat.toFixed(5)}, ${pinCoords[key].lng.toFixed(5)}` : 'No pin placed yet — tap the map or use your location'}</div>
  </div>`;
}

async function submitProvider(){

    lat:pinCoords.pv.lat, lng:pinCoords.pv.lng, createdAt:now()};

  await persist('providers');
  pinCoords.pv = null;
  toast('Provider registered', 'Your listing is live and marked unverified.', '✅');
  setView('services');

    ${data.bookings.map(b=>`<div class="card"><div style="display:flex; justify-content:space-between;"><div style="font-weight:700; font-size:14px;">${escapeHtml(b.providerName)}</div><span class="badge ${b.status==='pending'?'badge-pending':'badge-verified'}">${b.status}</span></div>
      <div class="feed-meta" style="margin-top:4px;">${escapeHtml(b.desc)}</div><div class="feed-meta" style="margin-top:6px;">Requested ${fmtAgo(b.time)}</div>
      ${b.status==='pending'?`<button class="btn btn-secondary" style="margin-top:10px;" onclick="acceptBooking('${b.id}')">Mark accepted by provider</button>`:''}</div>`).join('')}</div>`;
}
async function acceptBooking(id){
  const b = data.bookings.find(b=>b.id===id); b.status='accepted';
  await persist('bookings');
  toast('Booking accepted', `${b.providerName} accepted the request.`, '✅');
  renderContent();
}

/* ---------------- REPORT ---------------- */
function viewReport(){
  return `
    <div class="page-head"><div><div class="page-title">Report an incident</div><div class="page-sub">What happened? Where? How serious does it appear?</div></div></div>
    <div class="card" style="max-width:560px;">
      <div class="field"><label>Title</label><input id="rp-title" placeholder="Short summary, e.g. Flooding near Muthurwa"></div>
      <div class="field"><label>Category</label><select id="rp-category"><option>Flooding</option><option>Transport</option><option>Utilities</option><option>Infrastructure</option><option>Safety</option><option>Other</option></select></div>
      <div class="field"><label>What happened?</label><textarea id="rp-desc" placeholder="Describe what you're seeing..."></textarea></div>
      <div class="field"><label>Your name (optional)</label><input id="rp-name" placeholder="Anonymous by default"></div>
      ${miniMapField('rp', 'Tap the map to mark exactly where this is happening.')}
      <div class="field"><label>Severity</label><div class="severity-row">
        <div class="sev-opt" id="sev-low" onclick="pickSeverity('low')">Low</div>
        <div class="sev-opt on" id="sev-medium" onclick="pickSeverity('medium')">Medium</div>
        <div class="sev-opt" id="sev-high" onclick="pickSeverity('high')">High</div>
      </div></div>
      <button class="btn btn-primary" onclick="submitReport()">Submit report</button>
      <div class="feed-meta" style="margin-top:10px;">This creates a real, unverified incident. It only becomes higher-confidence as others confirm it.</div>
    </div>
  `;
}
let pickedSeverity = 'medium';
function pickSeverity(s){ pickedSeverity=s; ['low','medium','high'].forEach(x=>document.getElementById('sev-'+x).classList.toggle('on', x===s)); }
async function submitReport(){
  const title = document.getElementById('rp-title').value.trim();
  const desc = document.getElementById('rp-desc').value.trim();
  if(!title){ toast('Missing info', 'Give the report a short title.', '⚠️'); return; }
  if(!pinCoords.rp){ toast('Missing location', 'Tap the map or use your location to mark where this is happening.', '⚠️'); return; }
  const category = document.getElementById('rp-category').value;
  const reportedBy = document.getElementById('rp-name').value.trim() || 'Anonymous resident';
  const inc = {
    id:uid('inc'), title, category, description:desc, severity:pickedSeverity, status:'active',
    confidence:20, confirmations:0, reportedBy, createdAt:now(),
    lat:pinCoords.rp.lat, lng:pinCoords.rp.lng,
    timeline:[{time:now(), text:'Report submitted.', source:'community', by:reportedBy}],
  };
  data.incidents.unshift(inc);
  await persist('incidents');
  toast('Report submitted', 'Your incident is now live.', '📝');
  pickedSeverity='medium'; pinCoords.rp=null;
  openIncident(inc.id);
}

/* ---------------- ALERTS ---------------- */
function viewAlerts(){
  const wasUnread = data.alerts.some(a=>!a.read);
  data.alerts.forEach(a=>a.read=true);
  if(wasUnread) persist('alerts');
  return `<div class="page-head"><div><div class="page-title">Alerts</div><div class="page-sub">Generated automatically from real status changes on incidents you'd follow.</div></div></div>
    ${data.alerts.length ? `<div class="grid grid-2">${data.alerts.map(a=>`
      <div class="card"><div style="display:flex; gap:10px;"><span style="font-size:16px;">${a.level==='success'?'✅':a.level==='warning'?'⚠️':'🔔'}</span>
        <div><div style="font-weight:700; font-size:13.5px;">${escapeHtml(a.title)}</div><div style="font-size:12.5px; color:var(--paper-dim); margin-top:4px; line-height:1.5;">${escapeHtml(a.body)}</div><div class="feed-meta" style="margin-top:8px;">${fmtAgo(a.time)}</div></div></div></div>`).join('')}</div>`
      : `<div class="empty-state">No alerts yet.</div>`}`;
}

/* ---------------- ORG VIEWS ---------------- */
function viewOrgRegister(){
  return `<div class="page-head"><div><div class="page-title">Register your organization</div><div class="page-sub">Creates a real organization profile. Official-source authority still requires real-world verification — this alone doesn't grant it.</div></div></div>
    <div class="card" style="max-width:520px;">
      <div class="field"><label>Organization name</label><input id="org-name" placeholder="e.g. Nairobi Water & Sewerage Co."></div>
      <div class="field"><label>Sector</label><input id="org-sector" placeholder="e.g. Utilities, County government, Emergency services"></div>
      <button class="btn btn-primary" onclick="submitOrg()">Register organization</button>
    </div>`;
}
async function submitOrg(){
  const name = document.getElementById('org-name').value.trim();
  if(!name){ toast('Missing info','Organization name required.','⚠️'); return; }
  const sector = document.getElementById('org-sector').value.trim();
  data.orgs.unshift({id:uid('org'), name, sector, verified:false, createdAt:now()});
  await persist('orgs');
  toast('Organization registered', 'Unverified until confirmed by Hali Mtaani.', '✅');
  setView('org-dash');
}
function viewOrgDash(){
  if(!data.orgs.length){
    return `<div class="page-head"><div><div class="page-title">Operations Dashboard</div></div></div><div class="empty-state"><div class="e-icon">🏢</div>No organization registered yet.<br><br><button class="btn btn-primary" onclick="setView('org-register')">Register your organization</button></div>`;
  }
  const active = data.incidents.filter(i=>i.status!=='resolved').length;
  const resolved = data.incidents.filter(i=>i.status==='resolved').length;
  return `<div class="page-head"><div><div class="page-title">Operations Dashboard</div><div class="page-sub">${escapeHtml(activeOrgName())}${data.orgs[0].verified?' · ✓ Verified':' · Unverified'}</div></div></div>
    <div class="grid grid-3" style="margin-bottom:16px;">${statCard(active,'Active incidents')}${statCard(data.cases.length,'Open cases')}${statCard(resolved,'Resolved')}</div>
    <div class="card"><div style="font-weight:700; font-size:13px; margin-bottom:12px;">Incoming reports</div>
      ${data.incidents.filter(i=>i.status!=='resolved').map(feedCard).join('') || `<div class="empty-state">Nothing active.</div>`}</div>`;
}
function statCard(num,label){ return `<div class="card stat"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`; }
function viewOrgCases(){
  return `<div class="page-head"><div><div class="page-title">Cases</div></div></div>
    ${data.cases.length ? `<div class="grid grid-2">${data.cases.map(c=>`<div class="card" onclick="openCase('${c.id}')" style="cursor:pointer;">
      <div style="display:flex; justify-content:space-between;"><div style="font-weight:700; font-size:14px;">${escapeHtml(c.title)}</div>${statusBadge(c.status)}</div>
      <div class="feed-meta" style="margin-top:6px;">Priority: ${c.priority}</div><div class="feed-meta" style="margin-top:4px;">Updated ${fmtAgo(c.updatedAt)}</div></div>`).join('')}</div>`
      : `<div class="empty-state">No cases yet. Open one from an incident.</div>`}`;
}
function openCase(id){ state.selectedCase=id; setView('case'); }
function viewCaseDetail(){
  const c = data.cases.find(c=>c.id===state.selectedCase);
  if(!c) return `<div class="empty-state">Case not found.</div>`;
  return `<button class="btn btn-ghost" style="margin-bottom:16px;" onclick="setView('org-cases')">← Back to Cases</button>
    <div class="page-head"><div><div class="page-title">${escapeHtml(c.title)}</div><div class="page-sub">Case ${c.id}</div></div>${statusBadge(c.status)}</div>
    <button class="btn btn-primary" onclick="openIncident('${c.incidentId}')">View linked incident →</button>`;
}
function viewOrgComms(){
  if(!data.incidents.length) return `<div class="page-head"><div><div class="page-title">Public Updates</div></div></div><div class="empty-state">No incidents to comment on yet.</div>`;
  return `<div class="page-head"><div><div class="page-title">Public Updates</div><div class="page-sub">Official updates appear on the incident timeline for everyone.</div></div></div>
    <div class="card" style="max-width:560px;">
      <div class="field"><label>Message</label><textarea id="comms-text" placeholder="e.g. Repair crew on site, restoration expected in 8 hours."></textarea></div>
      <div class="field"><label>Attach to incident</label><select id="comms-inc">${data.incidents.map(i=>`<option value="${i.id}">${escapeHtml(i.title)}</option>`).join('')}</select></div>
      <button class="btn btn-primary" onclick="postOfficial()">Publish official update</button>
    </div>`;
}
async function postOfficial(){
  const id = document.getElementById('comms-inc').value;
  const text = document.getElementById('comms-text').value.trim();
  if(!text){ toast('Missing info','Write a message first.','⚠️'); return; }
  const inc = data.incidents.find(i=>i.id===id);
  inc.timeline.push({time:now(), text, source:'official', by:activeOrgName()});
  await persist('incidents');
  toast('Published', 'Official update added to incident timeline.', '📣');
  setView('org-comms');
}

/* expose */
Object.assign(window, {setRole,setView,toggleFilter,openIncident,confirmIncident,advanceIncident,openCaseFor,openProvider,
  submitProvider,requestBooking,acceptBooking,pickSeverity,submitReport,openCase,postOfficial,useMyLocationFor,submitOrg});

// Wait for Supabase to load, then start app (polls instead of a fixed delay, so it works on slow connections too)
function waitForSupabaseThenStart(attemptsLeft){
  if(window.supabase && !supabase){
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    loadAll();
    return;
  }
  if(attemptsLeft <= 0){
    console.warn('Supabase library never loaded — starting with empty/local state.');
    loadAll();
    return;
  }
  setTimeout(()=>waitForSupabaseThenStart(attemptsLeft-1), 200);
}
waitForSupabaseThenStart(50); // up to ~10s
</script>

<script>
/* Supabase loader: primary CDN + fallback CDN, and we VERIFY the global exists
   (a script can "load" without defining window.supabase if the wrong build resolves). */
(function(){
  var PRIMARY  = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  var FALLBACK = 'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  function ready(){ return !!(window.supabase && window.supabase.createClient); }
  window.__supabaseReady = ready;
  function load(src, cb){
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = function(){ cb(null); };
    s.onerror = function(){ cb(new Error('failed: ' + src)); };
    document.head.appendChild(s);
  }
  function ensureLoaded(src, next){
    load(src, function(err){
      if(err){
        console.warn('Supabase CDN failed (' + src + ')' + (next ? ' — trying fallback…' : ' — running offline.'));
        if(next) next();
        return;
      }
      var tries = 0;
      (function check(){
        if(ready()){ console.log('Supabase library loaded (' + src + ')'); return; }
        if(++tries < 25){ setTimeout(check, 200); return; } /* ~5s grace for slow parse */
        console.warn('Script from ' + src + ' did not provide window.supabase' + (next ? ' — trying fallback…' : ' — running offline.'));
        if(next) next();
      })();
    });
  }
  ensureLoaded(PRIMARY, function(){ ensureLoaded(FALLBACK, null); });
})();
</script>

<script>
/* =========================================================
   HALI MTAANI
   Offline-first: everything works on this device even with no
   connection; changes sync to Supabase automatically when the
   server is reachable. No seeded / fabricated content.
   ========================================================= */
'use strict';

/* ---------------- SMALL SAFE HELPERS ---------------- */
const now = () => Date.now();

function fmtTime(ts){
  if(ts==null || ts==='') return '--:--';
  const t = Number(ts);
  if(!isFinite(t) || t<=0) return '--:--';
  try{ return new Date(t).toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return '--:--'; }
}
function fmtAgo(ts){
  if(ts==null || ts==='') return 'recently';
  const t = Number(ts);
  if(!isFinite(t) || t<=0) return 'recently';
  const diff = Math.floor((now()-t)/60000);
  if(diff < 1) return 'just now';
  if(diff < 60) return diff+'m ago';
  if(diff < 1440) return Math.floor(diff/60)+'h ago';
  return Math.floor(diff/1440)+'d ago';
}
function uid(p){

/* HTML-escape for text content */
function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = (s==null ? '' : String(s));

/* Escape for double-quoted HTML attributes */
function escAttr(s){
  return escapeHtml(s).replace(/"/g,'&quot;');
}
/* Escape for a JS single-quoted string inside a double-quoted HTML attribute.
   HTML-decoding happens before JS parsing, so & must be encoded too. */
function q(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function queueRow(key, row){

function dequeueRow(key, id){

/* Classify Supabase/PostgREST errors so we react correctly */
function errCode(e){ return (e && (e.code || e.status)) ? String(e.code || e.status) : ''; }
function errMsg(e){ return String((e && e.message) || e || ''); }
function isSchemaError(e){ /* missing table / column — retrying won't help until the DB is fixed */
  const c = errCode(e), m = errMsg(e).toLowerCase();
  return c==='PGRST205' || c==='PGRST204' || c==='42P01' || c==='42703' || c==='404' ||
    m.indexOf('schema cache')>-1 || m.indexOf('does not exist')>-1 || m.indexOf('not found')>-1;
}
function isPermissionError(e){ /* RLS / auth — retrying won't help until policies are fixed */
  const c = errCode(e), m = errMsg(e).toLowerCase();
  return c==='42501' || c==='401' || c==='403' ||
    m.indexOf('row-level security')>-1 || m.indexOf('permission denied')>-1 || m.indexOf('unauthorized')>-1;
}

async function loadCollection(key){
  const client = ensureClient();
  if(!client || localOnly[key]) return {rows:[], failed:true, skipped:true};
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 6000);
    let req;
    try{
      req = client.from(key).select('*');
      if(req && typeof req.abortSignal==='function') req = req.abortSignal(controller.signal);
      const { data:rows, error } = await req;
      clearTimeout(timer);
      if(error) throw error;
      return {rows: Array.isArray(rows)?rows:[], failed:false};
    }catch(inner){ clearTimeout(timer); throw inner; }
  }catch(e){
    if(isSchemaError(e)){
      localOnly[key]=true;
      console.warn(`Table "${key}" is missing/unusable on the server — using on-device data. Run supabase-schema.sql to fix.`, e);
      noticeOnce('schema:'+key, 'Server table missing', `“${key}” isn't set up on the server yet — your entries are kept safely on this device.`, '⚠️');
    } else {
      console.warn(`Load ${key} failed (will retry)`, e);
    }
    return {rows:[], failed:true};
  }
}

/* Merge server rows with local-only rows (created while offline) so a sync never wipes them */
function mergeServerRows(key, serverRows){
  const seen = new Set();
  const merged = [];
  serverRows.forEach(r=>{
    if(r && r.id!=null){ seen.add(r.id); merged.push(r); }
  });
  (Array.isArray(data[key])?data[key]:[]).forEach(r=>{
    if(r && r.id!=null && !seen.has(r.id) && pendingIds.has(r.id)){ merged.push(r); }
  });
  return merged;
}

async function fetchAllCollections(){
  const work = Promise.all(COLLECTIONS.map(k=>loadCollection(KEYS[k])));
  const timeout = new Promise(res=>setTimeout(()=>res(null), 12000));
  const results = await Promise.race([work, timeout]);
  if(!results) return null;
  let anyOk = false;
  results.forEach((r,i)=>{
    const key = COLLECTIONS[i];
    if(!r.failed){
      anyOk = true;
      data[key] = mergeServerRows(key, r.rows);
    }
  });
  normalizeAll();
  writeCache();
  if(anyOk) backendLive = true;
  return results;
}

/* Save ONE row: always persist on-device first, then try the server. Never throws. */
async function saveRow(key, row){
  if(!row || !row.id) return {ok:false, synced:false};
  writeCache();
  queueRow(key, row); /* queued optimistically; removed again if the sync below succeeds */
  const client = ensureClient();
  if(!client || localOnly[key]){ updateSyncUI(); return {ok:true, synced:false}; }
  state.saving = true; updateSyncUI();
  try{
    const { error } = await client.from(key).upsert(row, {onConflict:'id'});
    if(error) throw error;
    dequeueRow(key, row.id);
    backendLive = true;
    return {ok:true, synced:true};
  }catch(e){
    if(isSchemaError(e)){
      localOnly[key]=true;
      dequeueRow(key, row.id);
      console.warn(`Save to "${key}" failed: table/column missing on server — kept on device.`, e);
      noticeOnce('schema:'+key, 'Server table missing', `“${key}” isn't set up on the server yet — your entries are kept safely on this device.`, '⚠️');
    } else if(isPermissionError(e)){
      dequeueRow(key, row.id);
      console.warn(`Save to "${key}" refused by server permissions — kept on device.`, e);
      noticeOnce('perm:'+key, 'Server permissions', `The server refused to save “${key}” (check access policies) — kept on this device.`, '⚠️');
    } else {
      console.warn(`Save ${key} failed (staying queued for retry)`, e);
    }
    return {ok:true, synced:false};
  }finally{
    state.saving = false; updateSyncUI();
  }
}

/* Push queued rows when the server becomes reachable again */
async function flushOutbox(){
  if(!outbox.length) return;
  const client = ensureClient();
  if(!client) return;
  const pending = outbox.slice(0,200);
  for(const entry of pending){
    if(!entry || !entry.key || !entry.row || !entry.row.id){ continue; }
    if(localOnly[entry.key]) continue;
    try{
      const { error } = await client.from(entry.key).upsert(entry.row, {onConflict:'id'});
      if(error) throw error;
      dequeueRow(entry.key, entry.row.id);
      backendLive = true;
    }catch(e){
      if(isSchemaError(e) || isPermissionError(e)){
        dequeueRow(entry.key, entry.row.id); /* retrying is pointless — keep the on-device copy */
        if(isSchemaError(e)) localOnly[entry.key]=true;
      } else {
        break; /* still offline — stop and try again next cycle */
      }
    }
  }
  updateSyncUI();
}

/* ---------------- REAL GEOLOCATION ---------------- */
const NAIROBI_FALLBACK = {lat:-1.2921, lng:36.8219};

let geoWatchId = null, geoBusy = false;
const geoQueue = [];
function requestGeolocation(onDone){
  if(typeof onDone==='function' && geoBusy){ geoQueue.push(onDone); return; } /* one GPS session at a time */
  if(typeof onDone==='function') geoQueue.push(onDone);
  if(geoBusy) return;
  geoBusy = true;

  const finish = (coords)=>{
    geoBusy = false;
    const cbs = geoQueue.splice(0, geoQueue.length);
    cbs.forEach(cb=>{ try{cb(coords);}catch(e){ console.warn('geo callback failed', e); } });
  };

  if(!('geolocation' in navigator)){
    state.locationStatus='unavailable'; state.locationLabel='Location not supported';
    updateLocationPill(); finish(null);
    return;
  }
  if(window.isSecureContext===false){
    state.locationStatus='unavailable'; state.locationLabel='Needs HTTPS to locate you';
    updateLocationPill(); finish(null);
    return;
  }
  if(geoWatchId!==null){ try{navigator.geolocation.clearWatch(geoWatchId);}catch(e){} geoWatchId=null; }
  state.locationStatus='pending'; state.locationLabel='Locating…'; updateLocationPill();

  let bestCoords=null, bestAccuracy=Infinity, settled=false;
  const settle = async (coords, accuracy)=>{
    if(settled) return; settled=true;
    if(geoWatchId!==null){ try{navigator.geolocation.clearWatch(geoWatchId);}catch(e){} geoWatchId=null; }
    if(coords){
      state.userCoords=coords; state.userAccuracy=accuracy; state.locationStatus='ok';
      await reverseGeocode(coords);
    }
    finish(coords||null);
  };

  try{
    geoWatchId = navigator.geolocation.watchPosition((pos)=>{
      if(!pos || !pos.coords) return;
      const coords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      const accuracy = (typeof pos.coords.accuracy==='number') ? pos.coords.accuracy : 9999;
      if(accuracy < bestAccuracy){ bestAccuracy = accuracy; bestCoords = coords; }
      if(accuracy <= 50) settle(coords, accuracy); /* GPS-grade fix — stop immediately */
    }, (err)=>{
      if(err && err.code===1){
        if(settled) return; settled=true;
        if(geoWatchId!==null){ try{navigator.geolocation.clearWatch(geoWatchId);}catch(e){} geoWatchId=null; }
        state.locationStatus='denied'; state.locationLabel='Location permission denied';
        updateLocationPill(); finish(null);
      }
      /* Other errors during watch: keep waiting for the deadline, watch can recover */
    }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  }catch(e){
    state.locationStatus='unavailable'; state.locationLabel='Location unavailable';
    updateLocationPill(); finish(null);
    return;
  }

  /* Deadline: after 12s accept the best fix seen (even coarse) rather than failing outright */
  setTimeout(()=>{
    if(settled) return;
    if(bestCoords) settle(bestCoords, bestAccuracy);
    else {
      settled=true;
      if(geoWatchId!==null){ try{navigator.geolocation.clearWatch(geoWatchId);}catch(e){} geoWatchId=null; }
      state.locationStatus='unavailable';
      state.locationLabel='Location unavailable — check device GPS/location settings';
      updateLocationPill(); finish(null);
    }
  }, 12000);
}
async function reverseGeocode(coords){
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 6000);
    let res;
    try{
      res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${coords.lat}&lon=${coords.lng}&zoom=16&addressdetails=1`, {signal:controller.signal, headers:{'Accept':'application/json'}});
    }finally{ clearTimeout(timer); }
    if(!res.ok) throw new Error('geocoder HTTP '+res.status);
    const j = await res.json();
    const a = (j && j.address) || {};
    const area = a.suburb || a.neighbourhood || a.road || a.town || a.city_district || a.village || a.city || 'Nearby area';
    const city = a.city || a.town || a.county || '';
    state.locationLabel = city && city!==area ? `${area}, ${city}` : area;
  }catch(e){
    state.locationLabel = `${Number(coords.lat).toFixed(5)}, ${Number(coords.lng).toFixed(5)}`;
  }
  updateLocationPill();
}

  const el = document.getElementById('location-pill-text');

}

/* ---------------- INITIAL LOAD + BACKGROUND SYNC ---------------- */
let pollCount = 0;

async function refreshFromServer(initial){
  try{ await flushOutbox(); }catch(e){ console.warn('Outbox flush failed', e); }
  let results = null;
  try{ results = await fetchAllCollections(); }catch(e){ console.warn('Refresh failed', e); }
  if(!results){
    backendLive = false;
    if(initial && isEmptyData()){
      toast('You’re offline', 'No connection and nothing saved yet — anything you add will be kept on this device.', '📡');
    }
  } else if(results.some(r=>r.failed) && initial && isEmptyData()){
    backendLive = backendLive || results.some(r=>!r.failed);
    if(!backendLive) toast('You’re offline', 'Couldn’t reach the server — anything you add is kept on this device.', '📡');
  }
  updateSyncUI();
  if(!FORM_VIEWS.has(state.view)) renderContent();
}

function startPollingFallback(){
  setInterval(async ()=>{
    if(document.hidden) return; /* don't churn in background tabs */
    if(!ensureClient() && !outbox.length && backendLive===false){
      /* nothing to do without a client, but keep the first poll cheap */
    }
    pollCount++;
    if(pollCount % 4 === 0){ /* re-probe tables marked unusable, in case the DB was fixed */
      Object.keys(localOnly).forEach(k=>{ delete localOnly[k]; });
    }
    if(realtimeStarted===false) subscribeRealtimeSafe(); /* self-heal if the library arrived late */
    try{ await flushOutbox(); }catch(e){}
    let results = null;
    try{ results = await fetchAllCollections(); }
    catch(e){ console.warn('Background sync poll failed', e); }
    if(results && results.some(r=>!r.failed)) backendLive = true;
    updateSyncUI();
    /* Data is refreshed above either way — but never redraw the screen out from under
       someone filling out a form. It'll reflect the fresh data next time they navigate. */
    if(!FORM_VIEWS.has(state.view)) renderContent();
  }, 15000); /* every 15s — catches up even if realtime push never arrives */
}

/* Realtime sync (pushes changes from any device to every other open device) */
function subscribeRealtimeSafe(){
  const client = ensureClient();
  if(!client || realtimeStarted) return;
  try{
    COLLECTIONS.forEach(key=>{
      client.channel(`public:${key}`)
        .on('postgres_changes', {event:'*', schema:'public', table:key}, (payload)=>{
          try{
            const arr = data[key];
            if(!arr || !payload) return;
            if(payload.eventType==='DELETE'){
              if(!payload.old || payload.old.id==null) return;
              const idx = arr.findIndex(r=>r && r.id===payload.old.id);
              if(idx>-1) arr.splice(idx,1);
            } else {
              if(!payload.new || payload.new.id==null) return;
              const idx = arr.findIndex(r=>r && r.id===payload.new.id);
              if(idx>-1) arr[idx] = payload.new; else arr.unshift(payload.new);
              dequeueRow(key, payload.new.id);
            }
            normalizeAll(); writeCache();
            if(!FORM_VIEWS.has(state.view)) renderContent();
          }catch(e){ console.warn('Realtime update failed to apply', e); }
        })
        .subscribe((status)=>{
          if(status==='SUBSCRIBED'){ backendLive = true; updateSyncUI(); }
          else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
            console.warn(`Realtime failed for ${key} (${status}) — relying on 15s polling fallback instead.`);
          }
        });
    });
    realtimeStarted = true;
  }catch(e){
    console.warn('Realtime subscribe failed — polling fallback will keep data fresh.', e);
  }
}

/* ---------------- TOASTS ---------------- */
function toast(title, body, icon){
  try{
    icon = icon || '🔔';
    const layer = document.getElementById('toast-layer');
    if(!layer) return;
    const el = document.createElement('div');
    el.className='toast';
    const ic = document.createElement('div'); ic.className='toast-icon'; ic.textContent = icon;
    const wrap = document.createElement('div');
    const t = document.createElement('div'); t.className='toast-title'; t.textContent = title||'';
    const b = document.createElement('div'); b.className='toast-body'; b.textContent = body||'';
    wrap.appendChild(t); wrap.appendChild(b);
    el.appendChild(ic); el.appendChild(wrap);
    layer.appendChild(el);
    while(layer.children.length > 4) layer.removeChild(layer.firstChild);
    setTimeout(()=>{ el.style.transition='opacity .4s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 4600);
  }catch(e){}
}

function setRole(r){ state.role=r; state.view = r==='resident'?'feed':'org-dash'; render(); }

function runSearch(query){
  state.searchQuery = String(query||'').trim();
  if(state.view!=='feed' && state.view!=='services') state.view='feed';
  render();
}
function clearSearch(){ state.searchQuery=''; renderContent(); }
function matchesQuery(text){
  const needle = state.searchQuery.trim().toLowerCase();
  if(!needle) return true;
  return String(text||'').toLowerCase().indexOf(needle)>-1;
}
function searchChipHTML(){
  if(!state.searchQuery) return '';
  return `<div class="search-chip">Results for “${escapeHtml(state.searchQuery)}” <button onclick="clearSearch()">Clear ✕</button></div>`;
}

function renderContent(){
  const c = document.getElementById('content');
  if(!c) return;
  const views = { feed:viewFeed, map:viewMap, services:viewServices, alerts:viewAlerts, bookings:viewBookings,
    report:viewReport, incident:viewIncident, provider:viewProvider, 'provider-register':viewProviderRegister,
    'org-dash':viewOrgDash, 'org-cases':viewOrgCases, 'org-comms':viewOrgComms, 'org-register':viewOrgRegister, 'case':viewCaseDetail };

  /* Background syncs call this on a timer regardless of what the user is doing.
     Snapshot typed values + focus/cursor first, rebuild the DOM, then restore them. */
  const activeEl = document.activeElement;
  const activeId = (activeEl && c.contains(activeEl) && activeEl.id) ? activeEl.id : null;
  const selStart = (activeEl && 'selectionStart' in activeEl) ? activeEl.selectionStart : null;
  const selEnd = (activeEl && 'selectionEnd' in activeEl) ? activeEl.selectionEnd : null;
  const preserved = {};
  try{
    c.querySelectorAll('input[id], textarea[id], select[id]').forEach(node=>{ preserved[node.id] = node.value; });
  }catch(e){}

  try{
    saveMapViewport();
    destroyMaps();
    c.innerHTML = (views[state.view] || viewFeed)();
  } catch(e){
    /* A throwing view must not leave the page stuck silently — fall back to a safe screen. */
    console.error(`View "${state.view}" failed to render`, e);
    try{ c.innerHTML = `<div class="empty-state">Something went wrong showing this page. <br><button class="btn btn-secondary" style="margin-top:10px;" onclick="setView('feed')">Go to Home</button></div>`; }catch(e2){}
  } finally {
    try{
      c.querySelectorAll('input[id], textarea[id], select[id]').forEach(node=>{
        if(preserved[node.id] !== undefined && node.value !== preserved[node.id]) node.value = preserved[node.id];
      });
      if(activeId){
        const toFocus = document.getElementById(activeId);
        if(toFocus){
          toFocus.focus();
          if(selStart!==null && selEnd!==null && toFocus.setSelectionRange){
            try{ toFocus.setSelectionRange(selStart, selEnd); }catch(e){}
          }
        }
      }
    }catch(e){}
  }

  /* Map init is isolated: a Leaflet hiccup here must never wipe the content above. */
  try{ initViewMaps(); }catch(e){ console.warn('Map init failed', e); }
}

/* ---------------- SHARED UI PIECES ---------------- */
function confidenceBadge(inc){
  const tl = Array.isArray(inc.timeline) ? inc.timeline : [];
  const sources = new Set(tl.map(t=>t && t.source).filter(Boolean));
  const dots = [...sources].map(s=>`<span class="cdot" style="background:${sourceColor[s]||'var(--paper-dim)'}"></span>`).join('');
  const conf = (typeof inc.confidence==='number') ? inc.confidence : 20;
  const n = (typeof inc.confirmations==='number') ? inc.confirmations : 0;
  return `<span class="confidence"><span class="confidence-dots">${dots}</span><span class="confidence-pct">${conf}%</span> confidence · ${n} confirmation${n===1?'':'s'}</span>`;
}
function severityColor(s){ return s==='high'?'var(--murram)': s==='medium'?'var(--ochre)':'var(--paper-dim)'; }
function statusBadge(status){
  const map = {active:['badge-pending','Active'], responding:['badge-official','Responding'], resolved:['badge-verified','Resolved'], 'in-progress':['badge-official','In progress'], pending:['badge-pending','Pending'], accepted:['badge-verified','Accepted']};
  const [cls,label] = map[status] || ['badge-pending', status||'Unknown'];
  return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
}

/* ---------------- FEED ---------------- */

        : `<div class="empty-state"><div class="e-icon">📭</div>No incidents reported yet.<br><br><button class="btn btn-primary" onclick="setView('report')">Report the first one</button></div>`}

function qa(icon,label,view){ return `<button class="qa-btn" onclick="setView('${view}')"><span class="qa-icon">${icon}</span><span class="qa-label">${label}</span></button>`; }
function feedCard(inc){

      <div class="feed-meta">${escapeHtml(inc.category||'Other')} · ${fmtAgo(inc.createdAt)} · Severity: <span style="color:${severityColor(inc.severity)}">${escapeHtml(inc.severity||'medium')}</span></div>
      <div class="feed-foot">${confidenceBadge(inc)}</div>

/* ---------------- MAP (real, Leaflet + OpenStreetMap, with offline fallback) ---------------- */
let mainMap = null, miniMaps = {}, pinCoords = {rp:null, pv:null};
let savedMapView = null;      /* preserve pan/zoom across background re-renders */
let leafletDead = false, leafletAttempts = 0;
const LEAFLET_MAX_ATTEMPTS = 40; /* ~12s, then show the no-map fallback instead of retrying forever */

function viewMap(){
  const showIncidents = state.mapFilters.incident ? data.incidents.filter(i=>i && i.lat!=null && i.lng!=null) : [];
  const showProviders = state.mapFilters.service ? data.providers.filter(p=>p && p.lat!=null && p.lng!=null) : [];
  const empty = !showIncidents.length && !showProviders.length;
  return `
    <div class="page-head"><div><div class="page-title">Map</div><div class="page-sub">Real locations on an actual street map — pinned by reporters and providers.</div></div></div>
    <div class="map-wrap">
      ${leafletDead ? mainMapFallbackHTML(showIncidents, showProviders) : `
      <div id="leaflet-mainmap" style="position:absolute; inset:0;"></div>
      <div class="map-filters">${filterChip('incident','⚠️ Incidents')}${filterChip('service','🛠️ Services')}</div>
      ${(!empty || store.get('hm_map_hint_dismissed')) ? '' : `
      <div class="map-empty-hint" id="map-empty-hint">
        <button class="meh-close" onclick="dismissMapHint()" title="Dismiss">✕</button>
        <div class="meh-title">No pins here yet</div>
        <div class="meh-sub">Be the first to put your mtaa on the map.</div>
        <button class="btn btn-primary meh-btn" onclick="setView('report')">📝 Report incident</button>
      </div>`}
      <div class="map-legend"><div class="legend-item"><span class="legend-dot" style="background:var(--murram)"></span> High severity</div><div class="legend-item"><span class="legend-dot" style="background:var(--ochre)"></span> Medium</div><div class="legend-item"><span class="legend-dot" style="background:var(--savanna)"></span> Provider</div></div>`}
    </div>
  `;
}
function mainMapFallbackHTML(showIncidents, showProviders){
  const items = [
    ...showIncidents.map(i=>`<div class="card feed-item" onclick="openIncident('${q(i.id)}')"><div class="feed-icon" style="background:${severityColor(i.severity)}22;color:${severityColor(i.severity)};">${catIcon[i.category]||'📍'}</div><div class="feed-body"><div class="feed-top"><span class="feed-title">${escapeHtml(i.title||'Untitled')}</span>${statusBadge(i.status||'active')}</div><div class="feed-meta">${escapeHtml(i.category||'Other')} · ${fmtAgo(i.createdAt)}</div></div></div>`),
    ...showProviders.map(p=>`<div class="card feed-item" onclick="openProvider('${q(p.id)}')"><div class="feed-icon" style="background:var(--savanna)22;color:var(--savanna);">🔧</div><div class="feed-body"><div class="feed-top"><span class="feed-title">${escapeHtml(p.name||'Unnamed')}</span></div><div class="feed-meta">${escapeHtml(p.category||'General')}</div></div></div>`)
  ].join('');
  return `<div class="map-filters">${filterChip('incident','⚠️ Incidents')}${filterChip('service','🛠️ Services')}</div>
    <div class="map-fallback" style="padding-top:54px;">
      <div class="map-fallback-note">🗺️ The interactive map library couldn't load (it needs a network connection) — showing the same places as a list instead. Everything still works.</div>
      ${items || '<div class="empty-state"><div class="e-icon">📭</div>Nothing pinned yet.</div>'}
    </div>`;
}
function filterChip(key,label){ return `<button class="filter-chip ${state.mapFilters[key]?'on':''}" onclick="toggleFilter('${key}')">${label}</button>`; }
function toggleFilter(key){ state.mapFilters[key]=!state.mapFilters[key]; renderContent(); }
function dismissMapHint(){
  store.set('hm_map_hint_dismissed','1');
  const el = document.getElementById('map-empty-hint');
  if(el) el.style.display='none';
}

function saveMapViewport(){
  if(!mainMap) return;
  try{
    const c = mainMap.getCenter();
    savedMapView = {lat:c.lat, lng:c.lng, zoom:mainMap.getZoom()};
  }catch(e){}
}

function initMainMap(){
  const container = document.getElementById('leaflet-mainmap');
  if(!container || typeof L==='undefined') return;
  if(container._leaflet_id){ try{ container._leaflet_id = null; }catch(e){} }
  const start = savedMapView || state.userCoords || NAIROBI_FALLBACK;
  mainMap = L.map(container, {zoomControl:false}).setView([start.lat, start.lng], savedMapView ? savedMapView.zoom : 13);
  try{ L.control.zoom({position:'bottomright'}).addTo(mainMap); }catch(e){}
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(mainMap);

  const showIncidents = state.mapFilters.incident ? data.incidents : [];
  const showProviders = state.mapFilters.service ? data.providers : [];
  showIncidents.forEach(inc=>{
    if(!inc || inc.lat==null || inc.lng==null) return;
    try{
      const icon = L.divIcon({html:`<div class="lf-pin" style="background:${severityColor(inc.severity)}"><span>${catIcon[inc.category]||'!'}</span></div>`, className:'', iconSize:[30,30], iconAnchor:[15,30]});
      L.marker([inc.lat, inc.lng], {icon}).addTo(mainMap).bindTooltip(String(inc.title||'Incident')).on('click', ()=>openIncident(inc.id));
    }catch(e){}
  });
  showProviders.forEach(p=>{
    if(!p || p.lat==null || p.lng==null) return;
    try{
      const icon = L.divIcon({html:`<div class="lf-pin" style="background:var(--savanna)"><span>🔧</span></div>`, className:'', iconSize:[30,30], iconAnchor:[15,30]});
      L.marker([p.lat, p.lng], {icon}).addTo(mainMap).bindTooltip(String(p.name||'Provider')).on('click', ()=>openProvider(p.id));
    }catch(e){}
  });
  if(state.userCoords){
    try{
      const youIcon = L.divIcon({html:`<div class="lf-pin-you"></div>`, className:'', iconSize:[16,16], iconAnchor:[8,8]});
      L.marker([state.userCoords.lat, state.userCoords.lng], {icon:youIcon}).addTo(mainMap).bindTooltip('You are here');
      if(state.userAccuracy){
        L.circle([state.userCoords.lat, state.userCoords.lng], {radius:state.userAccuracy, color:'#5C86A8', weight:1, fillColor:'#5C86A8', fillOpacity:0.12}).addTo(mainMap);
      }
      if(!savedMapView && (!state.userAccuracy || state.userAccuracy > 2000)){
        mainMap.setView([state.userCoords.lat, state.userCoords.lng], 11); /* coarse fix — zoom out so it stays honest */
      }
    }catch(e){}
  }
}

function initMiniMap(key){
  const container = document.getElementById(key+'-map');
  if(!container || typeof L==='undefined') return;
  if(container._leaflet_id){ try{ container._leaflet_id = null; }catch(e){} }
  const start = pinCoords[key] || state.userCoords || NAIROBI_FALLBACK;
  let map;
  try{
    map = L.map(container, {zoomControl:false, attributionControl:true}).setView([start.lat, start.lng], pinCoords[key] ? 16 : 13);
    map.attributionControl.setPrefix(false);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  }catch(e){
    container.innerHTML = `<div class="map-fallback-note">Mini-map unavailable — use “Use my location” or the coordinates below.</div>`;
    return;
  }
  let marker = null;
  function setPin(latlng){
    pinCoords[key] = {lat:latlng.lat, lng:latlng.lng};
    try{
      const icon = L.divIcon({html:'<div class="lf-pin-mini"></div>', className:'', iconSize:[22,22], iconAnchor:[11,22]});
      if(marker) marker.setLatLng(latlng); else marker = L.marker(latlng,{icon}).addTo(map);
    }catch(e){}
    const status = document.getElementById(key+'-geo-status');
    if(status) status.textContent = `Pinned at ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
  }
  if(pinCoords[key]){ try{ setPin(L.latLng(pinCoords[key].lat, pinCoords[key].lng)); }catch(e){} }
  try{ map.on('click', e=>setPin(e.latlng)); }catch(e){}
  miniMaps[key] = map;
}

function useMyLocationFor(key){
  const btn = document.getElementById(key+'-locate-btn');
  if(btn) btn.classList.add('locating');
  requestGeolocation((coords)=>{
    if(btn) btn.classList.remove('locating');
    if(!coords){ toast('Location unavailable', 'Could not get your device location — tap the map to place a pin manually.', '⚠️'); return; }
    pinCoords[key] = {lat:coords.lat, lng:coords.lng};
    const map = miniMaps[key];
    if(map && typeof L!=='undefined'){
      try{
        map.setView([coords.lat, coords.lng], 16);
        map.fire('click', {latlng: L.latLng(coords.lat, coords.lng)});
      }catch(e){}
    }
    const status = document.getElementById(key+'-geo-status');
    if(status) status.textContent = `Pinned at ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}`;
  });
}

/* Manual coordinates fallback when the map library can't load */
function applyManualCoords(key){
  const lat = parseFloat(val(key+'-lat'));
  const lng = parseFloat(val(key+'-lng'));
  if(!isFinite(lat) || !isFinite(lng) || lat<-90 || lat>90 || lng<-180 || lng>180){
    toast('Invalid coordinates', 'Enter a valid latitude (-90…90) and longitude (-180…180).', '⚠️');
    return;
  }
  pinCoords[key] = {lat, lng};
  const status = document.getElementById(key+'-geo-status');
  if(status) status.textContent = `Pinned at ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  toast('Location set', 'Pinned from the coordinates you entered.', '📍');
}

function destroyMaps(){
  if(mainMap){ try{ mainMap.remove(); }catch(e){} mainMap=null; }
  Object.keys(miniMaps).forEach(k=>{ try{ miniMaps[k].remove(); }catch(e){} });
  miniMaps={};
}
function initViewMaps(){
  if(typeof L==='undefined'){
    if(leafletDead) return;
    if(++leafletAttempts >= LEAFLET_MAX_ATTEMPTS){
      leafletDead = true;
      console.warn('Leaflet map library failed to load — showing list/coordinate fallbacks.');
      if(state.view==='map' || state.view==='report' || state.view==='provider-register') renderContent();
      return;
    }
    setTimeout(initViewMaps, 300);
    return;
  }
  leafletAttempts = 0;
  try{ if(state.view==='map') initMainMap(); }catch(e){ console.warn('Main map failed', e); }
  try{ if(state.view==='report') initMiniMap('rp'); }catch(e){ console.warn('Mini map failed', e); }
  try{ if(state.view==='provider-register') initMiniMap('pv'); }catch(e){ console.warn('Mini map failed', e); }
}

  return `

        <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="confirmIncident('${q(inc.id)}')" ${state.role!=='resident'||alreadyConfirmedByMe?'disabled':''}>${alreadyConfirmedByMe?'✓ You confirmed this':'✓ I can confirm this'}</button>
        </div>

        <div style="font-size:13px; color:var(--paper-dim); line-height:1.6;">${escapeHtml(inc.description || 'No further description provided.')}</div>
      </div>
    </div>

function orgIncidentActions(inc, linkedCase){
  return `<div style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
    <div style="font-weight:700; font-size:12px; margin-bottom:8px; color:var(--paper-dim);">ORGANIZATION ACTIONS</div>

      ${!linkedCase ? `<button class="btn btn-secondary" onclick="openCaseFor('${q(inc.id)}')">Open a case</button>` : ''}

      <button class="btn btn-secondary" onclick="advanceIncident('${q(inc.id)}','resolved')">Mark: Resolved</button>
    </div>

async function confirmIncident(id){
  const inc = data.incidents.find(i=>i && i.id===id);
  if(!inc) return;
  if(!Array.isArray(inc.confirmedBy)) inc.confirmedBy = [];
  const me = getDeviceId();
  if(inc.confirmedBy.includes(me)){
    toast('Already confirmed', 'You already confirmed this incident — one confirmation per device.', 'ℹ️');
    return;
  }
  inc.confirmedBy.push(me);
  inc.confirmations = (typeof inc.confirmations==='number'?inc.confirmations:0) + 1;
  inc.confidence = Math.min(96, (typeof inc.confidence==='number'?inc.confidence:20) + 6);
  if(!Array.isArray(inc.timeline)) inc.timeline = [];
  inc.timeline.push({time:now(), text:'A resident confirmed this incident. Confidence updated.', source:'community', by:'Resident confirmation'});
  const res = await saveRow('incidents', inc);
  toast('Confirmation recorded', res.synced ? `Confidence is now ${inc.confidence}%.` : `Confidence is now ${inc.confidence}%. Will sync when you're back online.`, '✅');
  renderContent();
}
async function advanceIncident(id, status){ return guardOnce('advanceIncident:'+id+':'+status, async ()=>{
  const inc = data.incidents.find(i=>i && i.id===id);
  if(!inc || inc.status===status) return;
  inc.status = status;
  const label = status==='responding' ? 'Response dispatched by organization.' : 'Marked resolved by organization.';
  if(!Array.isArray(inc.timeline)) inc.timeline = [];
  inc.timeline.push({time:now(), text:label, source:'official', by: activeOrgName()});
  const c = data.cases.find(c=>c && c.incidentId===id);
  if(c){ c.status = status==='resolved'?'resolved':'in-progress'; c.updatedAt = now(); await saveRow('cases', c); }
  await saveRow('incidents', inc);
  if(status==='resolved'){
    const alert = {id:uid('a'), title:'Resolved', body:`"${inc.title||'An incident'}" has been marked resolved.`, time:now(), level:'success'};
    data.alerts.unshift(alert);
    await saveRow('alerts', alert);
  }
  toast('Status updated', label, '📣');
  renderContent();
});}
async function openCaseFor(incidentId){ return guardOnce('openCaseFor:'+incidentId, async ()=>{
  if(data.cases.some(c=>c && c.incidentId===incidentId)) return; /* a case already exists for this incident */
  const inc = data.incidents.find(i=>i && i.id===incidentId);
  if(!inc) return;
  const c = {id:uid('case'), incidentId, org:activeOrgName(), title:inc.title||'Untitled', status:'in-progress', priority:inc.severity||'medium', assignedTeam:'Unassigned', updatedAt:now()};
  data.cases.unshift(c);
  await saveRow('cases', c);
  toast('Case opened', 'This incident now has an operational case.', '🗂️');
  renderContent();
});}

/* ---------------- BOOT ---------------- */
let booted = false;
function boot(){
  if(booted) return; booted = true;
  loadCacheIntoData();       /* instant, works offline */
  state.loading = false;
  render();
  requestGeolocation();
  refreshFromServer(true);   /* live data merges in when it arrives */
  subscribeRealtimeSafe();
  startPollingFallback();
  window.addEventListener('online', ()=>{ refreshFromServer(false); });
  window.addEventListener('offline', ()=>{ backendLive=false; updateSyncUI(); });
}

/* Start once the Supabase library arrives — or after ~6s regardless (offline mode).
   Backend calls self-heal via ensureClient() if the library arrives late. */
function waitForSupabaseThenStart(attemptsLeft){
  if(booted) return;
  const libReady = (typeof window.__supabaseReady==='function') ? window.__supabaseReady() : !!(window.supabase && window.supabase.createClient);
  if(libReady){ ensureClient(); boot(); return; }
  if(attemptsLeft <= 0){
    console.log('Starting in offline mode (Supabase library not loaded yet — will connect automatically if it arrives).');
    boot();
    return;
  }
  setTimeout(()=>waitForSupabaseThenStart(attemptsLeft-1), 200);
}
waitForSupabaseThenStart(30);
